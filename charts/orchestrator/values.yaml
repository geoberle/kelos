image:
  repository: ghcr.io/hearthctl/kelos-orchestrator
  tag: "0.1.0"
  digest: ""
imagePullSecrets: []
credentialSecret: github-admission
configuration:
  version: v1
  repositories: []
  pollInterval: 1m
  # Dedicated GitHub identity; empty keeps review reconciliation disabled.
  controllerLogin: ""
  # Enable only after target repository enforcement has been verified.
  # Merging needs the app permissions "Actions: write" and "Commit statuses:
  # write", which verify a pull request on the current base.
  mergeEnabled: false
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# configuration.assessment: {namespace: kelos-agents, workspaces: {owner/repo: read-only-repo}, agentConfig: assessment, secret: kelos-openai}
# configuration.implementation: {namespace: kelos-agents} reports stopped implementation Tasks and posts the run command on admission.
# Its optional consoleURL (the Kelos Console origin) adds a link to the Task's log on the issue while the Task runs.
