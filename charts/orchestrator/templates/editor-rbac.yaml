{{- if .Values.configuration.editor }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-editor
  namespace: {{ .Values.configuration.editor.namespace }}
rules:
  - apiGroups: [kelos.dev]
    resources: [tasks]
    verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-editor
  namespace: {{ .Values.configuration.editor.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-editor
{{- end }}
