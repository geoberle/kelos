{{- if .Values.configuration.implementation }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-implementation
  namespace: {{ .Values.configuration.implementation.namespace }}
rules:
  - apiGroups: [kelos.dev]
    resources: [tasks]
    verbs: [list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-implementation
  namespace: {{ .Values.configuration.implementation.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-implementation
{{- end }}
