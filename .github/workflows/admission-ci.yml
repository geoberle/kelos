name: Admission CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.2
      - run: make fmt-check lint test build chart
      - uses: docker/setup-buildx-action@v3
      - run: make image
