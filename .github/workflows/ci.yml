name: CI
on: pull_request
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: hearthctl/.github/checkout@main
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.2
      - uses: hearthctl/.github/verify@main
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: make image
