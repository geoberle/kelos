name: Admission release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.2
      - run: make fmt-check lint test build chart
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/kelos-orchestrator:${{ github.ref_name }}
      - name: Package and publish pinned chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REGISTRY_USER: ${{ github.actor }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          export IMAGE_REPOSITORY="ghcr.io/$REGISTRY_OWNER/kelos-orchestrator"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('charts/orchestrator/values.yaml')
          s = p.read_text().replace('ghcr.io/hearthctl/kelos-orchestrator', os.environ['IMAGE_REPOSITORY'])
          s = s.replace('digest: ""', 'digest: "' + os.environ['IMAGE_DIGEST'] + '"')
          p.write_text(s)
          PY
          helm package charts/orchestrator --version "${RELEASE_TAG#v}" --app-version "$RELEASE_TAG" -d dist
          helm push "dist/orchestrator-${RELEASE_TAG#v}.tgz" "oci://ghcr.io/$REGISTRY_OWNER/charts"
          helm pull "oci://ghcr.io/$REGISTRY_OWNER/charts/orchestrator" --version "${RELEASE_TAG#v}" --destination /tmp
          helm template smoke "/tmp/orchestrator-${RELEASE_TAG#v}.tgz" --set 'configuration.repositories[0]=hearthctl/kelos-orchestrator' > /tmp/rendered.yaml
